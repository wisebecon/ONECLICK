```yaml
name: Build ONECLICK Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Construire ONECLICK
        run: npm run build:win

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: ONECLICK-Windows
          path: dist/*.exe
```
